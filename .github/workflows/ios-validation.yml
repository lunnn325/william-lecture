name: iOS Validation IPA
on:
  push:
    branches: [main, master, 'codex/**']
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Standard public Apple Silicon runner, not a paid larger runner.
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.5
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Install pinned XcodeGen 2.46.0
        run: |
          mkdir -p .tools
          curl --fail --location https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o .tools/xcodegen.zip
          unzip -q .tools/xcodegen.zip -d .tools
          echo "$PWD/.tools/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Test core and build unsigned IPA
        run: bash scripts/build-ios.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WilliamLecture-V1-unsigned-IPA
          path: dist/WilliamLecture-V1-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Verify fresh install and V1 phone/tablet flows
        timeout-minutes: 42
        run: bash scripts/test-first-launch.sh
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/swift-test.log
            build/xcodebuild.log
            build/Validation.xcresult
            build/FirstLaunch.log
            build/FirstLaunch.xcresult
            build/TabletFlow.log
            build/TabletFlow.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload native interface captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V1-interface-screenshots
          path: build/screenshots/
          if-no-files-found: ignore
          retention-days: 14
